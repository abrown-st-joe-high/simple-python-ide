<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Chatbot IDE</title>
<style>
:root{--bg:#1b1c23;--pn:#252732;--ln:#3a3d4d;--tx:#e6e6ef;--mu:#8b8fa3;--ac:#4f9cf9;--er:#ff6b6b;--ok:#6bd68b;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
button{background:#33364a;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button:hover:not(:disabled){background:#40445c}button:disabled{opacity:.4;cursor:default}
button.pri{background:#2d7d46;border-color:#2d7d46}
#fname{flex:1;max-width:320px;min-width:120px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;font:14px var(--mono)}
#fname.bad{border-color:var(--er)}
.sp{flex:1}#st{color:var(--mu);font-size:12px}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}#main.fl{grid-template-columns:210px 1fr 1fr}#main:not(.fl)>aside{display:none}
#main>*{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--ln)}
.h{padding:6px 10px;background:#20222c;color:var(--mu);font-size:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln)}
.h button{padding:2px 8px;font-size:12px}
#flist{overflow:auto;flex:1}
.f{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;cursor:pointer;font-family:var(--mono);font-size:13px;word-break:break-all}
.f:hover{background:#2c2f3c}.f.on{background:#33405e}
.f button{border:0;background:none;padding:0 4px;color:var(--mu)}.f button:hover{color:var(--er)!important;background:none!important}
#wrap{position:relative;flex:1;min-height:0;display:flex;overflow:hidden;background:var(--pn)}
#gut{width:46px;flex:none;overflow:hidden;text-align:right;padding:8px 8px 20px 0;color:var(--mu);font:14px/20px var(--mono);background:#20222c;border-right:1px solid var(--ln)}
#gut .er{color:var(--er);font-weight:bold}
#hl{position:absolute;left:46px;right:0;height:20px;background:rgba(255,107,107,.2);display:none;pointer-events:none}
#code{flex:1;position:relative;z-index:1;border:0;outline:0;resize:none;background:transparent;color:var(--tx);font:14px/20px var(--mono);padding:8px 8px 20px 10px;white-space:pre;overflow:auto;tab-size:4}
#term{flex:1;overflow:auto;background:#0c0d10;color:#d8f5d8;font:14px/1.4 var(--mono);padding:10px;white-space:pre-wrap;word-break:break-word;cursor:text}
#term .e{color:var(--er)}#term .m{color:var(--mu)}#term .u{color:#fff}
.tin{background:transparent;border:0;outline:0;color:#fff;font:inherit;padding:0;width:1ch;caret-color:#fff}
#errbar{padding:8px 12px;font:13px var(--mono);border-top:1px solid var(--ln)}
#errbar.ok{background:#1d2a22;color:var(--ok)}#errbar.bad{background:#3a1f24;color:var(--er);cursor:pointer}
[hidden]{display:none!important}
#term .g{color:var(--ok)}#term .r{color:var(--er)}#term .y{color:#f0c674}#term .p{color:#7fb4ff}
select{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:3px 6px;font:inherit;max-width:120px}
.f span{flex:1}.b{font:bold 11px var(--mono);font-style:normal;margin:0 4px;flex:none}.b.g{color:var(--ok)}.b.r{color:var(--er)}
#brow{justify-content:flex-start;font-family:var(--mono)}
details{position:relative}summary{cursor:pointer;padding:6px 12px;background:#33364a;border:1px solid var(--ln);border-radius:6px;list-style:none}
.menu{position:absolute;right:0;top:36px;z-index:5;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:10px;white-space:nowrap}
@media(max-width:800px){#main{display:flex;flex-direction:column}#main>section{flex:1}#main>aside{max-height:150px}}
</style></head><body>
<header>
<b>🐍 Chatbot IDE</b><button id="ftog">📁 Files ▾</button>
<input id="fname" placeholder="file name" spellcheck="false" autocomplete="off" aria-label="File name">
<button id="run" class="pri">▶ Run</button><button id="stop" disabled>■ Stop</button>
<span class="sp"></span><span id="st" hidden></span>
<button id="dl">⬇ Download all (JSON)</button>
<details id="opts"><summary>⚙ Options</summary><div class="menu">
<label><input type="checkbox" id="o-saved"> Show last saved time</label>
<label><input type="checkbox" id="o-files"> Show file list</label>
<label><input type="checkbox" id="o-git"> Learning Git mode</label>
</div></details>
</header>
<div id="main">
<aside><div id="prow" class="h" hidden><select id="proj" aria-label="Project"></select><span><button id="newp" title="New project">+</button> <button id="delp" title="Delete project">🗑</button></span></div>
<div id="brow" class="h" hidden></div>
<div class="h">Files <button id="new">+ New</button></div><div id="flist"></div></aside>
<section><div class="h">Code <span>Ctrl+Enter to run</span></div>
<div id="wrap"><div id="hl"></div><div id="gut"></div>
<textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" wrap="off" aria-label="Code editor"></textarea></div></section>
<section><div class="h">Terminal</div><div id="term"></div></section>
</div>
<div id="errbar" class="ok"></div>
<script>
const $=id=>document.getElementById(id);
const O=o=>Object.assign(Object.create(null),o);
class F{constructor(v){this.v=v}}
class PyErr{constructor(type,msg,line){this.type=type;this.msg=msg;this.line=line}}
class Stop{constructor(q){this.q=q}}
class Fn{constructor(name,ps,b){this.name=name;this.ps=ps;this.b=b}}
class Mod{constructor(a){this.a=a}}
class Scope{constructor(){this.v=new Map();this.g=null}}

/* ---------- lexer ---------- */
const OPS3=['**=','//='],OPS2=['==','!=','<=','>=','+=','-=','*=','/=','%=','**','//'];
function lex(src){
  src=src.replace(/\r\n?/g,'\n');
  const T=[],ind=[0],br=[];let i=0,line=1,bol=true;
  const push=(t,v)=>T.push({t,v,line});
  const se=(m,l)=>new PyErr('SyntaxError',m,l||line);
  function readStr(isF){
    const q=src[i],tri=src.substr(i,3)==q+q+q,start=line;
    i+=tri?3:1;let buf='';const parts=[];
    for(;;){
      if(i>=src.length||(!tri&&src[i]=='\n'))throw se('unterminated string literal',start);
      const ch=src[i];
      if(tri?src.substr(i,3)==q+q+q:ch==q){i+=tri?3:1;break}
      if(ch=='\n')line++;
      if(ch=='\\'){
        const n=src[i+1],mp={n:'\n',t:'\t','\\':'\\',"'":"'",'"':'"'};
        if(n=='\n'){i+=2;line++;continue}
        if(n in mp){buf+=mp[n];i+=2;continue}
        buf+=ch;i++;continue}
      if(isF&&ch=='{'){
        if(src[i+1]=='{'){buf+='{';i+=2;continue}
        let j=i+1,d=0,f=-1,qq=null;
        for(;j<src.length;j++){const x=src[j];
          if(qq){if(x==qq)qq=null;continue}
          if(x=="'"||x=='"'){qq=x;continue}
          if('([{'.includes(x))d++;
          else if(')]'.includes(x))d--;
          else if(x=='}'){if(d==0)break;d--}
          else if(x==':'&&d==0&&f<0)f=j;
          else if(x=='\n'&&!tri)break}
        if(src[j]!='}')throw se("f-string: expecting '}'");
        if(buf)parts.push(buf);buf='';
        parts.push({ex:src.slice(i+1,f<0?j:f),fm:f<0?'':src.slice(f+1,j),line});
        i=j+1;continue}
      if(isF&&ch=='}'){if(src[i+1]=='}'){buf+='}';i+=2;continue}throw se("f-string: single '}' is not allowed")}
      buf+=ch;i++}
    if(isF){if(buf)parts.push(buf);push('FSTR',parts)}else push('STR',buf)}
  while(i<src.length){
    if(bol&&!br.length){
      let c=0,j=i;
      while(src[j]==' '||src[j]=='\t'){c+=src[j]=='\t'?4:1;j++}
      if(j>=src.length||src[j]=='\n'||src[j]=='#'){while(j<src.length&&src[j]!='\n')j++;i=j+1;line++;continue}
      i=j;bol=false;
      if(c>ind[ind.length-1]){ind.push(c);push('INDENT')}
      else{while(c<ind[ind.length-1]){ind.pop();push('DEDENT')}
        if(c!=ind[ind.length-1])throw new PyErr('IndentationError','unindent does not match any outer indentation level',line)}}
    const c=src[i];let m;
    if(c=='\n'){if(!br.length){push('NL');bol=true}line++;i++;continue}
    if(c==' '||c=='\t'||c=='\r'){i++;continue}
    if(c=='#'){while(i<src.length&&src[i]!='\n')i++;continue}
    if(c=='\\'&&src[i+1]=='\n'){i+=2;line++;continue}
    if(/[\d.]/.test(c)&&(m=/^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(src.slice(i,i+40)))){
      i+=m[0].length;push('NUM',/[.eE]/.test(m[0])?new F(parseFloat(m[0])):parseInt(m[0]));continue}
    if(/[A-Za-z_]/.test(c)){
      let j=i;while(j<src.length&&/\w/.test(src[j]))j++;
      const w=src.slice(i,j);
      if((w=='f'||w=='F')&&(src[j]=='"'||src[j]=="'")){i=j;readStr(true);continue}
      push('NAME',w);i=j;continue}
    if(c=='"'||c=="'"){readStr(false);continue}
    const s3=src.substr(i,3),s2=src.substr(i,2);
    if(OPS3.includes(s3)){push('OP',s3);i+=3;continue}
    if(OPS2.includes(s2)){push('OP',s2);i+=2;continue}
    if('+-*/%<>=()[]{},:.'.includes(c)){
      if('([{'.includes(c))br.push([c,line]);
      if(')]}'.includes(c)){
        const o=br.pop();
        if(!o)throw se(`unmatched '${c}'`);
        if('([{'.indexOf(o[0])!=')]}'.indexOf(c))throw se(`closing parenthesis '${c}' does not match opening parenthesis '${o[0]}'`)}
      push('OP',c);i++;continue}
    throw se(`invalid character '${c}'`)}
  if(br.length)throw se(`'${br[br.length-1][0]}' was never closed`,br[br.length-1][1]);
  if(T.length&&T[T.length-1].t!='NL')push('NL');
  while(ind.length>1){ind.pop();push('DEDENT')}
  push('END');return T}

/* ---------- parser ---------- */
const KW=new Set(['if','elif','else','while','for','in','def','return','break','continue','pass','import','from','as','and','or','not','is','global','True','False','None']);
function parse(T,exprOnly){
  let p=0;
  const pk=()=>T[p],nx=()=>T[p++];
  const se=(m,t)=>new PyErr('SyntaxError',m,(t||pk()).line);
  const isO=v=>pk().t=='OP'&&pk().v==v,isK=v=>pk().t=='NAME'&&pk().v==v;
  const eatO=v=>isO(v)&&(p++,true),eatK=v=>isK(v)&&(p++,true);
  const needO=(v,m)=>{if(!eatO(v))throw se(m||'invalid syntax')};
  const COMMA="invalid syntax. Perhaps you forgot a comma?";
  const okT=e=>e.k=='n'||e.k=='sub'||(e.k=='tuple'&&e.items.length&&e.items.every(okT));
  const chk=e=>{if(!okT(e))throw new PyErr('SyntaxError',(e.k=='call'?'cannot assign to function call here':'cannot assign to expression here')+". Maybe you meant '==' instead of '='?",e.line||pk().line)};
  const end=t0=>{if(pk().t=='NL'){p++;return}
    throw se(t0.t=='NAME'&&t0.v=='print'?"Missing parentheses in call to 'print'. Did you mean print(...)?":'invalid syntax')};
  function block(ln){
    needO(':',"expected ':'");
    if(pk().t=='NL'){p++;
      if(pk().t!='INDENT')throw new PyErr('IndentationError','expected an indented block',ln);
      p++;const b=[];
      while(pk().t!='DEDENT'&&pk().t!='END')b.push(stmt());
      if(pk().t=='DEDENT')p++;return b}
    return[simple()]}
  const cond=()=>{const e=test();if(isO('='))throw se("invalid syntax. Maybe you meant '==' or ':=' instead of '='?");return e};
  function target(){const e=postfix();chk(e);return e}
  function stmt(){
    const t=pk(),ln=t.line;
    if(t.t=='INDENT')throw new PyErr('IndentationError','unexpected indent',ln);
    if(t.t=='NAME'){
      if(t.v=='if'||t.v=='while'){
        p++;const c=cond(),b=block(ln);
        if(t.v=='while')return{k:'while',c,b,line:ln};
        let o=[];
        if(isK('elif')){T[p].v='if';o=[stmt()]}
        else if(isK('else')){o=block(nx().line)}
        return{k:'if',c,b,o,line:ln}}
      if(t.v=='for'){
        p++;const a=[];do a.push(target());while(eatO(','));
        const tg=a.length>1?{k:'tuple',items:a,line:ln}:a[0];
        if(!eatK('in'))throw se('invalid syntax');
        const it=testlist();return{k:'for',tg,it,b:block(ln),line:ln}}
      if(t.v=='def'){
        p++;const nm=nx();
        if(nm.t!='NAME'||KW.has(nm.v))throw se('invalid syntax',nm);
        needO('(',"expected '('");const ps=[];
        while(!isO(')')){const a=nx();
          if(a.t!='NAME'||KW.has(a.v))throw se('invalid syntax',a);
          ps.push({n:a.v,d:eatO('=')?test():null});if(!eatO(','))break}
        needO(')',"expected ')'");
        return{k:'def',name:nm.v,ps,b:block(ln),line:ln}}}
    return simple()}
  function simple(){
    const t=pk(),ln=t.line;let r;
    if(t.t=='NAME'&&['break','continue','pass'].includes(t.v)){p++;r={k:t.v,line:ln}}
    else if(isK('return')){p++;r={k:'ret',e:pk().t=='NL'?null:testlist(),line:ln}}
    else if(isK('import')){p++;const m=nx();if(m.t!='NAME')throw se('invalid syntax',m);
      r={k:'import',m:m.v,as:eatK('as')?nx().v:m.v,line:ln}}
    else if(isK('from')){p++;const m=nx();if(!eatK('import'))throw se('invalid syntax');
      const n=[];do{const a=nx();n.push([a.v,eatK('as')?nx().v:a.v])}while(eatO(','));
      r={k:'from',m:m.v,n,line:ln}}
    else if(isK('global')){p++;const n=[];do n.push(nx().v);while(eatO(','));r={k:'global',n,line:ln}}
    else{
      const e=testlist();
      if(isO('=')){const parts=[e];while(eatO('='))parts.push(testlist());
        const v=parts.pop();parts.forEach(chk);r={k:'asg',tg:parts,v,line:ln}}
      else if(pk().t=='OP'&&/^([-+*%]|\/\/|\/|\*\*)=$/.test(pk().v)){
        const op=nx().v.slice(0,-1);chk(e);r={k:'aug',tg:e,op,v:testlist(),line:ln}}
      else r={k:'expr',e,line:ln}}
    end(t);return r}
  function testlist(){
    const ln=pk().line,a=[test()];
    if(!isO(','))return a[0];
    while(eatO(',')){if(pk().t=='NL'||isO(')')||isO('=')||isO(':'))break;a.push(test())}
    return{k:'tuple',items:a,line:ln}}
  function test(){
    const a=orT();
    if(isK('if')){const ln=nx().line,c=orT();
      if(!eatK('else'))throw se("expected 'else' after 'if' expression");
      return{k:'tern',c,a,b:test(),line:ln}}
    return a}
  function orT(){let a=andT();while(isK('or')){const ln=nx().line;a={k:'or',a,b:andT(),line:ln}}return a}
  function andT(){let a=notT();while(isK('and')){const ln=nx().line;a={k:'and',a,b:notT(),line:ln}}return a}
  function notT(){if(isK('not')){const ln=nx().line;return{k:'not',a:notT(),line:ln}}return cmp()}
  function cmp(){
    const ln=pk().line,a=arith(),ops=[],rs=[];
    for(;;){let op=null;const t=pk();
      if(t.t=='OP'&&['==','!=','<','>','<=','>='].includes(t.v)){op=t.v;p++}
      else if(isK('in')){op='in';p++}
      else if(isK('not')&&T[p+1].t=='NAME'&&T[p+1].v=='in'){op='not in';p+=2}
      else if(isK('is')){p++;op=eatK('not')?'is not':'is'}
      if(!op)break;ops.push(op);rs.push(arith())}
    return ops.length?{k:'cmp',a,ops,rs,line:ln}:a}
  function arith(){let a=term();while(isO('+')||isO('-')){const o=nx();a={k:'bin',op:o.v,a,b:term(),line:o.line}}return a}
  function term(){let a=fac();while(isO('*')||isO('/')||isO('//')||isO('%')){const o=nx();a={k:'bin',op:o.v,a,b:fac(),line:o.line}}return a}
  function fac(){if(isO('-')||isO('+')){const o=nx();return{k:'un',op:o.v,a:fac(),line:o.line}}return pow()}
  function pow(){const a=postfix();if(isO('**')){const o=nx();return{k:'bin',op:'**',a,b:fac(),line:o.line}}return a}
  function postfix(){
    let a=atom();
    for(;;){const t=pk();
      if(isO('(')){p++;const args=[],kw={};
        while(!isO(')')){
          if(pk().t=='NAME'&&T[p+1].t=='OP'&&T[p+1].v=='='&&!KW.has(pk().v)){const n=nx().v;p++;kw[n]=test()}else args.push(test());
          if(!eatO(','))break}
        needO(')',COMMA);a={k:'call',f:a,args,kw,line:t.line};continue}
      if(isO('[')){p++;let lo=null,hi=null,sl=false;
        if(!isO(':'))lo=test();
        if(eatO(':')){sl=true;if(!isO(']'))hi=test()}
        needO(']',"expected ']'");
        a=sl?{k:'slice',a,lo,hi,line:t.line}:{k:'sub',a,i:lo,line:t.line};continue}
      if(isO('.')){p++;const n=nx();if(n.t!='NAME')throw se('invalid syntax',n);a={k:'attr',a,n:n.v,line:t.line};continue}
      return a}}
  function atom(){
    const t=nx(),line=t.line;
    if(t.t=='NUM')return{k:'c',v:t.v,line};
    if(t.t=='STR'){let s=t.v;while(pk().t=='STR')s+=nx().v;return{k:'c',v:s,line}}
    if(t.t=='FSTR')return{k:'fs',line,parts:t.v.map(x=>typeof x=='string'?x:{e:subParse(x.ex,x.line),fm:x.fm})};
    if(t.t=='NAME'){
      if(t.v=='True')return{k:'c',v:true,line};
      if(t.v=='False')return{k:'c',v:false,line};
      if(t.v=='None')return{k:'c',v:null,line};
      if(KW.has(t.v))throw se('invalid syntax',t);
      return{k:'n',n:t.v,line}}
    if(t.t=='OP'){
      if(t.v=='('){if(eatO(')'))return{k:'tuple',items:[],line};const e=testlist();needO(')',COMMA);return e}
      if(t.v=='['){const items=[];while(!isO(']')){items.push(test());if(!eatO(','))break}needO(']',COMMA);return{k:'list',items,line}}
      if(t.v=='{'){const ks=[],vs=[];
        while(!isO('}')){ks.push(test());needO(':',"expected ':'");vs.push(test());if(!eatO(','))break}
        needO('}',COMMA);return{k:'dict',ks,vs,line}}}
    throw se('invalid syntax',t)}
  function subParse(s,line){
    try{const tk=lex(s.trim());tk.forEach(x=>x.line=line);return parse(tk,true)}
    catch(e){if(e instanceof PyErr)e.line=line;throw e}}
  if(exprOnly){const e=testlist();if(pk().t!='NL')throw se('invalid syntax');return e}
  const prog=[];while(pk().t!='END')prog.push(stmt());return prog}

/* ---------- runtime helpers ---------- */
let G,L=0,depth=0,stopped=false,cancel=null,lastY=0,running=false,err=null;
const BRK={},CNT={};
const E=(t,m)=>new PyErr(t,m,L);
const tn=x=>x===null?'NoneType':typeof x=='boolean'?'bool':typeof x=='number'?'int':x instanceof F?'float':typeof x=='string'?'str':Array.isArray(x)?'list':x instanceof Map?'dict':x instanceof Mod?'module':'function';
const isN=x=>typeof x=='number'||typeof x=='boolean'||x instanceof F;
const nv=x=>x instanceof F?x.v:+x;
const mk=(v,f)=>f?new F(v):v;
const key=k=>k instanceof F?k.v:k;
const T_=x=>!(x===null||x===false||x===0||x===''||(x instanceof F&&x.v===0)||(Array.isArray(x)&&!x.length)||(x instanceof Map&&!x.size));
function repr(x){
  if(x===null)return 'None';if(x===true)return 'True';if(x===false)return 'False';
  if(typeof x=='number')return String(x);
  if(x instanceof F){const v=x.v;if(Number.isInteger(v)&&Math.abs(v)<1e16)return v.toFixed(1);return String(v)}
  if(typeof x=='string'){const q=x.includes("'")&&!x.includes('"')?'"':"'";return q+x.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').split(q).join('\\'+q)+q}
  if(Array.isArray(x))return '['+x.map(repr).join(', ')+']';
  if(x instanceof Map)return '{'+[...x].map(([k,v])=>repr(k)+': '+repr(v)).join(', ')+'}';
  if(x instanceof Fn)return '<function '+x.name+'>';
  return '<built-in>'}
const str=x=>typeof x=='string'?x:repr(x);
function eq(a,b){
  if(isN(a)&&isN(b))return nv(a)===nv(b);
  if(Array.isArray(a)&&Array.isArray(b))return a.length==b.length&&a.every((x,i)=>eq(x,b[i]));
  return a===b}
const c2=(o,x,y)=>o=='<'?x<y:o=='>'?x>y:o=='<='?x<=y:x>=y;
function ord(o,a,b){
  if(isN(a)&&isN(b))return c2(o,nv(a),nv(b));

async function sh(line){
  grab();
  const tk=[...line.matchAll(/"([^"]*)"|'([^']*)'|(\S+)/g)].map(m=>m[1]??m[2]??m[3]),c=tk[0],fs=P().files;
  try{
    if(!c);
    else if(c=='git')git(tk.slice(1));
    else if(c=='help')out(HELP);
    else if(c=='clear')term.textContent='';
    else if(c=='ls')out(fs.map(f=>f.name).join('  ')+'\n');
    else if(c=='cat'){const f=fs.find(x=>x.name==tk[1]);if(f)out(f.code+(!f.code||f.code.endsWith('\n')?'':'\n'));else Er(`cat: ${tk[1]||''}: No such file`)}
    else if(c=='touch'){
      if(!tk[1]||!/^[\w.\-]+$/.test(tk[1]))Er('usage: touch <file name>');
      else if(!fs.some(x=>x.name==tk[1]))fs.push({name:tk[1],code:''})}
    else if(c=='rm'){
      const i=fs.findIndex(x=>x.name==tk[1]);
      if(i<0)Er(`rm: cannot remove '${tk[1]||''}': No such file`);
      else if(fs.length==1)Er('rm: cannot remove the last file in a project');
      else{const was=cur().name;fs.splice(i,1);touch(was)}}
    else if(c=='python'||c=='python3'){
      if(!fs.some(x=>x.name==tk[1]))Er(`python: can't open file '${tk[1]||''}'`);
      else await runCode(tk[1],true)}
    else Er(`${c}: command not found (type help)`)}
  catch(e){Er('Error: '+(e&&e.message||e))}
  if(dirty){dirty=false;load()}else renderFiles()}
function showPrompt(focus){
  term.querySelectorAll('.cl').forEach(x=>x.remove());
  if(!S.o.git||running)return;
  const w=document.createElement('span');w.className='cl';
  const lab=document.createElement('span');lab.className='p';
  const r=P().git;
  lab.textContent=P().name+(r?' ('+(hname(r)||sh7(r.head))+')':'')+' $ ';
  const i=document.createElement('input');
  i.className='tin';i.autocomplete='off';i.spellcheck=false;
  i.setAttribute('autocapitalize','off');i.setAttribute('autocorrect','off');
  i.oninput=()=>{i.style.width=Math.max(1,i.value.length+1)+'ch'};
  i.onkeydown=async e=>{
    if(e.key=='Enter'){
      const v=i.value;w.remove();out(lab.textContent,'p');out(v+'\n','u');
      if(v.trim())hist.push(v);
      hi=hist.length;await sh(v);showPrompt(true)}
    else if(e.key=='ArrowUp'&&hi>0){i.value=hist[--hi];i.oninput();e.preventDefault()}
    else if(e.key=='ArrowDown'){hi=Math.min(hi+1,hist.length);i.value=hist[hi]||'';i.oninput();e.preventDefault()}};
  w.append(lab,i);term.appendChild(w);term.scrollTop=term.scrollHeight;
  if(focus)i.focus()}
load();applyOpts();setBtn();
</script></body></html>
